<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | FoodieFindr</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="min-h-screen bg-linear-to-br from-orange-50 via-orange-100 to-orange-300">

  

  <!-- FIXED NAVBAR -->
   <header
        class="fixed top-0 left-0 w-full bg-white border-b border-black/20 z-50"
      >
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center">
          <div class="flex items-center gap-3">
            <img
              src="IMAGES/foodfinr_logo.png"
              class="w-12 h-12 rounded-full"
            />
            <span class="text-xl font-bold text-gray-900">FoodieFindr</span>
          </div>

          <div class="hidden md:flex items-center ml-auto gap-28">
            <nav class="flex items-center gap-8 text-gray-800">
              <a href="Dashboard.html" class="hover:text-orange-600">Home</a>
              <a href="search.html" class="hover:text-orange-600">Categories</a>
              <a href="team.html" class="hover:text-orange-600">Team</a>
            </nav>

    <!-- Mobile Button -->
    <button id="menuBtn" class="md:hidden text-3xl text-blue-700 transition-transform duration-200">
  ☰
</button>

  </div>

  <!-- Mobile Menu -->
  <div
    id="mobileMenu"
    class="hidden md:hidden bg-white/90 backdrop-blur-xl border-t border-white/40 px-6 py-6 space-y-4"
  >
    <a href="Dashboard.html" class="block font-medium text-gray-700 hover:text-orange-600">Home</a>
    <a href="about.html" class="block font-medium text-gray-700 hover:text-orange-600">About</a>
    <a href="team.html" class="block font-medium text-gray-700 hover:text-orange-600">Team</a>
  </div>
</header>


  <!-- MAIN CONTENT -->
  <section
    class="min-h-screen pt-32 flex items-center justify-center px-6 py-20"
  >
    <div class="max-w-5xl w-full bg-white/90 backdrop-blur rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- Header -->
    <div class="text-center px-10 pt-12">
      <h1 class="text-4xl font-extrabold text-gray-900">Contact FoodieFindr</h1>
      <p class="mt-3 text-gray-600 max-w-xl mx-auto">
        Have questions, feedback, or partnership ideas? We’d love to hear from you.
    </p>
          </div>

    <!-- Content -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 p-10 mt-6">

      <!-- Contact Info -->
      <div class="bg-orange-50 rounded-2xl p-8 space-y-6">
        <h2 class="text-2xl font-bold text-gray-900">Get in touch</h2>

      <div>
          <p class="text-sm text-gray-500">Email</p>
          <p class="text-orange-600 font-medium">foodfindr27@gmail.com</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Phone</p>
          <p class="text-orange-600 font-medium">0707 216 1185</p>
        </div>

        <div>
          <p class="text-sm text-gray-500">Location</p>
          <p class="text-gray-700">
            Abeokuta, Ogun State<br />
            Nigeria
          </p>
        </div>

        <p class="text-sm text-gray-500 pt-4">
          We typically respond within 24 hours.
        </p>
      </div>

      <!-- Contact Form -->
      <form class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
          Full Name
        </label>
                <input
          type="text"
          placeholder="Your full name"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition"
                />
              </div>

      <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
          Email Address
        </label>
        <input
          type="email"
          placeholder="you@example.com"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition"
        />
            </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
        Message
      </label>
      <textarea
        rows="5"
        placeholder="Tell us how we can help you..."
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition resize-none"
      ></textarea>
        </div>

            <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-semibold py-3 rounded-full shadow-lg transition"
            >
        Send Message
            </button>
      </form>
    </div>
  </div>
</section>

<script>
  const btn = document.getElementById("menuBtn");
  const menu = document.getElementById("mobileMenu");

  btn.addEventListener("click", () => {
    menu.classList.toggle("hidden");

    // Toggle icon
    if (menu.classList.contains("hidden")) {
      btn.textContent = "☰";
    } else {
      btn.textContent = "✕";
    }
  });
</script>


</body>
</html>
