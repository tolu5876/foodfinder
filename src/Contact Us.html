<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | FoodieFindr</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-orange-50 via-orange-100 to-orange-300"
  >
    <!-- FIXED NAVBAR -->
    <header
      class="fixed top-0 left-0 w-full bg-white border-b border-black/20 z-50"
    >
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center">
        <div class="flex items-center gap-3">
          <img src="IMAGES/foodfinr_logo.png" class="w-12 h-12 rounded-full" />
          <span class="text-xl font-bold text-gray-900">FoodieFindr</span>
        </div>
        <div class="hidden md:flex items-center ml-auto gap-28">
          <nav class="flex items-center gap-8 text-gray-800">
            <a href="Dashboard.html" class="hover:text-orange-600">Home</a>
            <a href="search.html" class="hover:text-orange-600">Categories</a>
            <a href="team.html" class="hover:text-orange-600">Team</a>
          </nav>
          <button id="menuBtn" class="md:hidden text-3xl transition">☰</button>
        </div>

        <!-- Mobile Menu -->
        <div
          id="mobileMenu"
          class="hidden md:hidden bg-white/90 backdrop-blur-xl border-t border-white/40 px-6 py-6 space-y-4"
        >
          <a
            href="Dashboard.html"
            class="block font-medium text-gray-700 hover:text-orange-600"
            >Home</a
          >
          <a
            href="about.html"
            class="block font-medium text-gray-700 hover:text-orange-600"
            >About</a
          >
          <a
            href="team.html"
            class="block font-medium text-gray-700 hover:text-orange-600"
            >Team</a
          >
        </div>
      </div>
    </header>

    <!-- SUCCESS ALERT -->
    <div
      id="contactAlert"
      class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-4 rounded-xl shadow-lg"
      style="display: none"
    >
      <strong>Success!</strong> Your message has been sent.
    </div>

    <!-- MAIN CONTENT -->
    <section
      class="min-h-screen pt-32 flex items-center justify-center px-6 py-20"
    >
      <div
        class="max-w-5xl w-full bg-white/90 backdrop-blur rounded-3xl shadow-2xl overflow-hidden"
      >
        <div class="text-center px-10 pt-12">
          <h1 class="text-4xl font-extrabold text-gray-900">
            Contact FoodieFindr
          </h1>
          <p class="mt-3 text-gray-600 max-w-xl mx-auto">
            Have questions, feedback, or partnership ideas? We’d love to hear
            from you.
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 p-10 mt-6">
          <!-- Contact Info -->
          <div class="bg-orange-50 rounded-2xl p-8 space-y-6">
            <h2 class="text-2xl font-bold text-gray-900">Get in touch</h2>
            <div>
              <p class="text-sm text-gray-500">Email</p>
              <p class="text-orange-600 font-medium">foodfindr27@gmail.com</p>
            </div>

            <div>
              <p class="text-sm text-gray-500">Location</p>
              <p class="text-gray-700">Abeokuta, Ogun State<br />Nigeria</p>
            </div>
          </div>

          <!-- Contact Form -->
          <form id="contactForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Full Name</label
              >
              <input
                type="text"
                id="user_name"
                name="user_name"
                placeholder="Your full name"
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Email Address</label
              >
              <input
                type="email"
                id="user_email"
                name="user_email"
                placeholder="you@example.com"
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Message</label
              >
              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Tell us how we can help you..."
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition resize-none"
              ></textarea>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-semibold py-3 rounded-full shadow-lg transition flex items-center justify-center gap-2"
            >
              <span id="btnText">Send Message</span>
              <svg
                id="loader"
                class="hidden w-5 h-5 animate-spin text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                ></path>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- SCRIPT -->
    <script>
      /* ============================================
         📧 EMAIL SETUP - SUPER SIMPLE!
         ============================================
         
         ⚠️ TO MAKE THIS WORK, YOU NEED TO GET ONE ACCESS KEY:
         
         STEP 1: Go to https://web3forms.com/
         STEP 2: Enter your email: foodfindr27@gmail.com
         STEP 3: Click "Get Your Access Key"
         STEP 4: Check your email and copy the access key
         STEP 5: Replace "YOUR_ACCESS_KEY_HERE" below with your key
         
         THAT'S IT! The form will send emails to foodfindr27@gmail.com
      */

      // ✅ Access Key Configured!
      const ACCESS_KEY = "d40bc135-a056-466a-8087-4bd49394a36f";

      // MOBILE MENU
      const btn = document.getElementById("menuBtn");
      const menu = document.getElementById("mobileMenu");
      if (btn && menu) {
        btn.addEventListener("click", () => {
          menu.classList.toggle("hidden");
          btn.textContent = menu.classList.contains("hidden") ? "☰" : "✕";
        });
      }

      // CONTACT FORM LOGIC
      const form = document.getElementById("contactForm");
      const successAlert = document.getElementById("contactAlert");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const loader = document.getElementById("loader");

      // ERROR ALERT
      const errorAlert = document.createElement("div");
      errorAlert.innerHTML =
        "<strong>Error!</strong> Please fill in all fields.";
      errorAlert.className =
        "fixed top-24 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-4 rounded-xl shadow-lg z-50";
      errorAlert.style.display = "none";
      document.body.appendChild(errorAlert);

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("user_name");
        const email = document.getElementById("user_email");
        const message = document.getElementById("message");

        // hide alerts
        successAlert.style.display = "none";
        errorAlert.style.display = "none";

        // VALIDATION
        if (
          !name.value.trim() ||
          !email.value.trim() ||
          !message.value.trim()
        ) {
          errorAlert.style.display = "block";
          setTimeout(() => {
            errorAlert.style.display = "none";
          }, 3000);
          return;
        }

        // Check if access key is set - if not, use mailto as fallback
        if (
          ACCESS_KEY === "YOUR_ACCESS_KEY_HERE" ||
          !ACCESS_KEY ||
          ACCESS_KEY.trim() === ""
        ) {
          // FALLBACK: Use mailto link if access key not set
          const subject = encodeURIComponent(
            "New Contact Form Message from " + name.value.trim()
          );
          const body = encodeURIComponent(
            "Name: " +
              name.value.trim() +
              "\n\n" +
              "Email: " +
              email.value.trim() +
              "\n\n" +
              "Message:\n" +
              message.value.trim()
          );
          const mailtoLink =
            "mailto:foodfindr27@gmail.com?subject=" + subject + "&body=" + body;

          // Open email client
          window.location.href = mailtoLink;

          // Show success message
          submitBtn.disabled = false;
          btnText.textContent = "Send Message";
          loader.classList.add("hidden");

          successAlert.innerHTML =
            "<strong>📧 Opening Email Client...</strong><br><br>" +
            "Your default email app should open. If it doesn't, you can manually email:<br>" +
            "<strong>foodfindr27@gmail.com</strong><br><br>" +
            "<small>To enable automatic sending, get an access key from web3forms.com</small>";
          successAlert.style.maxWidth = "600px";
          successAlert.style.textAlign = "left";
          successAlert.style.padding = "20px";
          successAlert.style.display = "block";

          // Also show info about getting access key
          setTimeout(() => {
            errorAlert.innerHTML =
              "<strong>💡 Tip:</strong> To send emails automatically (without opening email app),<br>" +
              "get a free access key from <a href='https://web3forms.com/' target='_blank' style='color: #ffeb3b; text-decoration: underline;'>web3forms.com</a><br>" +
              "Then replace YOUR_ACCESS_KEY_HERE in the code.";
            errorAlert.style.maxWidth = "600px";
            errorAlert.style.textAlign = "left";
            errorAlert.style.padding = "15px";
            errorAlert.style.display = "block";
            setTimeout(() => {
              errorAlert.style.display = "none";
            }, 10000);
          }, 2000);

          form.reset();
          return;
        }

        // LOADING
        submitBtn.disabled = true;
        btnText.textContent = "Sending...";
        loader.classList.remove("hidden");

        // Send email using Web3Forms (much simpler!)
        const formData = new FormData();
        formData.append("access_key", ACCESS_KEY);
        formData.append("name", name.value.trim());
        formData.append("email", email.value.trim());
        formData.append("message", message.value.trim());
        formData.append(
          "subject",
          "New Contact Form Message from " + name.value.trim()
        );
        formData.append("from_name", "FoodieFindr Contact Form");

        fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData,
        })
          .then(async (response) => {
            let json = await response.json();
            console.log("Response:", json);

            if (response.status === 200 && json.success) {
              // SUCCESS
              console.log("✅ SUCCESS! Message sent!", json);
              submitBtn.disabled = false;
              btnText.textContent = "Send Message";
              loader.classList.add("hidden");

              successAlert.innerHTML =
                "<strong>✅ Success!</strong> Your message has been sent to foodfindr27@gmail.com";
              successAlert.style.display = "block";
              form.reset();

              setTimeout(() => {
                successAlert.style.display = "none";
              }, 6000);
            } else {
              // ERROR from API
              let errorMsg = json.message || "Failed to send message";
              if (json.errors) {
                errorMsg += " - " + JSON.stringify(json.errors);
              }
              throw new Error(errorMsg);
            }
          })
          .catch((error) => {
            // ERROR - Show actual error message
            console.error("❌ FAILED...", error);
            submitBtn.disabled = false;
            btnText.textContent = "Send Message";
            loader.classList.add("hidden");

            let errorMessage = "Failed to send message. ";

            if (error.message) {
              errorMessage += error.message;
            } else if (error.toString().includes("access_key")) {
              errorMessage +=
                "Invalid access key. Please check your Web3Forms access key.";
            } else {
              errorMessage +=
                "Please check your internet connection and try again.";
            }

            errorAlert.innerHTML =
              "<strong>❌ Error!</strong> " +
              errorMessage +
              "<br><small>Check browser console (F12) for details.</small>";
            errorAlert.style.display = "block";
            setTimeout(() => {
              errorAlert.style.display = "none";
            }, 10000);
          });
      });
    </script>
  </body>
</html>
