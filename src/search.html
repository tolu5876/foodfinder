<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FoodFindr - Professional Recipe Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #fb923c;
        --primary-dark: #f97316;
        --primary-light: #fdba74;
        --secondary: #fed7aa;
        --secondary-dark: #fdba74;
        --accent: #ea580c;
        --accent-dark: #dc2626;
        --success: #22c55e;
        --warning: #f97316;
        --danger: #ef4444;
        --dark: #1f2937;
        --gray: #6b7280;
        --light: #f3f4f6;
        --white: #ffffff;
        --bg: linear-gradient(135deg, #ffffff 0%, #fed7aa 50%, #fb923c 100%);
        --card: rgba(255, 255, 255, 0.98);
        --shadow: 0 25px 50px -12px rgba(251, 146, 60, 0.25);
        --shadow-lg: 0 30px 60px -12px rgba(251, 146, 60, 0.35);
        --border: #fed7aa;
        --gradient-text: linear-gradient(135deg, #fb923c, #ea580c);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          #fed7aa 50%,
          #fb923c 100%
        );
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        color: var(--dark);
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            circle at 20% 80%,
            rgba(251, 146, 60, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(251, 146, 60, 0.2) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 40% 40%,
            rgba(254, 215, 170, 0.3) 0%,
            transparent 50%
          );
        pointer-events: none;
        animation: floatGradient 15s ease-in-out infinite;
      }

      @keyframes floatGradient {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        33% {
          transform: translate(-20px, -20px) rotate(120deg);
        }
        66% {
          transform: translate(20px, -10px) rotate(240deg);
        }
      }

      .app {
        width: 85%;
        max-width: 900px;
        margin: 20px auto;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
        position: relative;
      }

      .app-container {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 255, 255, 0.85)
        );
        backdrop-filter: blur(20px);
        width: 100%;
        padding: 30px;
        border-radius: 20px;
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, 0.3),
          0 15px 30px -30px rgba(0, 0, 0, 0.4),
          inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        z-index: 1;
        overflow: hidden;
        min-width: 0;
        box-sizing: border-box;
      }

      .app-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          #fb923c 0%,
          #f97316 25%,
          #ea580c 50%,
          #dc2626 75%,
          #fed7aa 100%
        );
        border-radius: 30px 30px 0 0;
        animation: gradientShift 3s ease-in-out infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .app::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(
          90deg,
          var(--primary),
          var(--secondary),
          var(--accent),
          var(--gold)
        );
        border-radius: 40px 40px 0 0;
      }

      .app::after {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(
          45deg,
          var(--primary),
          var(--secondary),
          var(--accent),
          var(--gold)
        );
        border-radius: 42px;
        z-index: -1;
        opacity: 0.3;
        animation: borderGlow 3s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% {
          opacity: 0.2;
        }
        100% {
          opacity: 0.4;
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
        position: relative;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
        background: linear-gradient(
          135deg,
          #fb923c 0%,
          #f97316 30%,
          #ea580c 70%,
          #dc2626 100%
        );
        border-radius: 50%;
        box-shadow:
          0 20px 40px rgba(251, 146, 60, 0.3),
          0 10px 20px rgba(249, 115, 22, 0.2),
          inset 0 0 0 2px rgba(255, 255, 255, 0.2);
        position: relative;
        overflow: hidden;
        animation: logoFloat 4s ease-in-out infinite;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }

      .logo:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow:
          0 40px 80px rgba(251, 146, 60, 0.5),
          0 20px 40px rgba(249, 115, 22, 0.3),
          inset 0 0 0 2px rgba(255, 255, 255, 0.3);
      }

      .logo::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: logoShine 3s ease-in-out infinite;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(5deg);
        }
      }

      @keyframes logoShine {
        0% {
          transform: translateX(-100%) translateY(-100%) rotate(45deg);
        }
        50% {
          transform: translateX(100%) translateY(100%) rotate(45deg);
        }
        100% {
          transform: translateX(-100%) translateY(-100%) rotate(45deg);
        }
      }

      .logo img {
        width: 90%;
        height: 90%;
        object-fit: cover;
        border-radius: 50%;
        position: relative;
        z-index: 2;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 4rem;
        font-weight: 800;
        margin-bottom: 20px;
        background: linear-gradient(
          135deg,
          #fb923c 0%,
          #f97316 50%,
          #ea580c 100%
        );
        /* -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 20px rgba(251, 146, 60, 0.3);
        animation: titleGlow 3s ease-in-out infinite alternate; */
      }

      @keyframes titleGlow {
        0% {
          filter: brightness(1) drop-shadow(0 0 20px rgba(251, 146, 60, 0.3));
        }
        100% {
          filter: brightness(1.2) drop-shadow(0 0 30px rgba(234, 88, 12, 0.4));
        }
      }

      .subtitle {
        font-size: 1.4rem;
        font-weight: 500;
        margin-bottom: 0;
        letter-spacing: 1px;
        color: rgba(163, 140, 140, 0.9);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 1s ease-out 0.3s both;
      }

      .subtitle::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        border-radius: 1px;
      }

      /* ===== PROFESSIONAL SEARCH UI ===== */
      .search-section {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(255, 255, 255, 0.9) 50%,
          rgba(254, 215, 170, 0.1) 100%
        );
        backdrop-filter: blur(20px);
        border: 2px solid rgba(251, 146, 60, 0.1);
        border-radius: 24px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow:
          0 20px 40px rgba(251, 146, 60, 0.15),
          0 10px 20px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          inset 0 -1px 0 rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .search-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          #fb923c 0%,
          #f97316 25%,
          #ea580c 50%,
          #dc2626 75%,
          #fed7aa 100%
        );
        border-radius: 40px 40px 0 0;
        animation: gradientShift 4s ease-in-out infinite;
      }

      .search-section::after {
        content: "";
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 30% 70%,
            rgba(251, 146, 60, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 70% 30%,
            rgba(254, 215, 170, 0.06) 0%,
            transparent 50%
          );
        animation: professionalFloat 12s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes professionalFloat {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        25% {
          transform: translate(-20px, -15px) rotate(90deg) scale(1.05);
        }
        50% {
          transform: translate(-10px, -25px) rotate(180deg) scale(1.02);
        }
        75% {
          transform: translate(-25px, -10px) rotate(270deg) scale(1.03);
        }
      }

      .search-title {
        background: linear-gradient(
          135deg,
          #fb923c 0%,
          #f97316 30%,
          #ea580c 70%,
          #dc2626 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 40px;
        text-align: center;
        position: relative;
        z-index: 2;
        letter-spacing: 2px;
        text-transform: uppercase;
        filter: drop-shadow(0 4px 20px rgba(251, 146, 60, 0.3));
        animation: titlePulse 3s ease-in-out infinite;
      }

      @keyframes titlePulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 4px 20px rgba(251, 146, 60, 0.3));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 6px 25px rgba(251, 146, 60, 0.4));
        }
      }

      .search-title::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120%;
        height: 120%;
        background: radial-gradient(
          circle,
          rgba(251, 146, 60, 0.1) 0%,
          transparent 70%
        );
        z-index: -1;
        animation: titleGlow 4s ease-in-out infinite;
      }

      @keyframes titleGlow {
        0%,
        100% {
          opacity: 0.3;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 0.6;
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      .search-controls {
        display: flex;
        gap: 24px;
        margin-bottom: 40px;
        position: relative;
        z-index: 2;
        align-items: stretch;
      }

      .search-input {
        flex: 1;
        padding: 20px;
        font-size: 1rem;
        font-weight: 600;
        border: 3px solid transparent;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(255, 255, 255, 0.95) 100%
        );
        color: #1f2937;
        box-shadow: 
          0 6px 20px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          inset 0 -1px 0 rgba(0, 0, 0, 0.05);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: block;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .search-input::placeholder {
        color: rgba(107, 114, 128, 0.6);
        font-weight: 500;
        font-style: normal;
        transition: all 0.3s ease;
      }

      .search-input:focus {
        outline: none;
        border-color: #fb923c;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(255, 255, 255, 1) 100%
        );
        box-shadow:
          0 12px 40px rgba(251, 146, 60, 0.2),
          0 4px 20px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 0 0 4px rgba(251, 146, 60, 0.1);
        transform: translateY(-2px);
      }

      .search-input:focus::placeholder {
        color: rgba(107, 114, 128, 0.4);
        transform: translateX(4px);
      }

      .search-btn {
        padding: 20px 30px;
        font-size: 1rem;
        font-weight: 700;
        border: 3px solid transparent;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          #fb923c 0%,
          #f97316 30%,
          #ea580c 70%,
          #dc2626 100%
        );
        color: white;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:
          0 8px 24px rgba(251, 146, 60, 0.3),
          0 4px 12px rgba(249, 115, 22, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
        overflow: hidden;
        text-transform: uppercase;
        letter-spacing: 1px;
        min-width: 140px;
        justify-content: center;
      }

      .search-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        transition: left 0.6s ease;
      }

      .search-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 50%,
          rgba(0, 0, 0, 0.1) 100%
        );
        border-radius: 24px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .search-btn:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow:
          0 20px 48px rgba(251, 146, 60, 0.4),
          0 10px 24px rgba(249, 115, 22, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 0 0 6px rgba(251, 146, 60, 0.1);
      }

      .search-btn:hover::before {
        left: 100%;
      }

      .search-btn:hover::after {
        opacity: 1;
      }

      .search-btn:active {
        transform: translateY(-2px) scale(1.01);
        box-shadow:
          0 12px 32px rgba(251, 146, 60, 0.3),
          0 6px 16px rgba(249, 115, 22, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .search-btn i {
        font-size: 1.3rem;
        animation: iconPulse 2s ease-in-out infinite;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      @keyframes iconPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .search-loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 24px auto;
        display: none;
        position: relative;
        z-index: 1;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* ===== RESULTS SECTION ===== */
      .results-section {
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        border-radius: 32px;
        padding: 40px;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.08),
          0 0 0 1px rgba(0, 0, 0, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
        backdrop-filter: blur(10px);
      }

      .results-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--primary),
          var(--secondary),
          var(--accent)
        );
        border-radius: 32px 32px 0 0;
      }

      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 2rem;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        overflow: hidden;
      }

      .recipe-card {
        background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
        border-radius: 24px;
        padding: 2rem;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          0 1px 2px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.8);
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        word-wrap: break-word;
        position: relative;
      }

      .recipe-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        border-radius: 24px 24px 0 0;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .recipe-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.15),
          0 0 0 1px rgba(37, 99, 235, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .recipe-card:hover::before {
        opacity: 1;
      }

      .recipe-image {
        width: 100%;
        max-width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 1.5rem;
        display: block;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .recipe-card:hover .recipe-image {
        transform: scale(1.05);
      }

      .recipe-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--dark);
        margin-bottom: 1rem;
        line-height: 1.3;
        background: linear-gradient(135deg, var(--dark), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .recipe-meta {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        padding: 1rem;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      .recipe-meta span {
        font-size: 0.9rem;
        color: var(--gray);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
      }

      .recipe-meta span i {
        color: var(--primary);
        font-size: 1rem;
      }

      .ingredients-title,
      .instructions-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--dark);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .ingredients-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        color: var(--dark);
      }

      .ingredient-item {
        background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
        border: 1px solid #0ea5e9;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        transition: all 0.3s ease;
        font-weight: 500;
        position: relative;
        overflow: hidden;
      }

      .ingredient-item::before {
        content: "✓";
        position: absolute;
        left: -20px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--primary);
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        transition: left 0.3s ease;
