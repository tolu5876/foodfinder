<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFindr - Login</title>
    <link rel="stylesheet" href="./login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-container">
      <h2>FoodFindr</h2>
      <p>Welcome back! Please login to your account.</p>
      <form class="login-form" id="loginForm">
        <div
          id="loginAlert"
          class="alert alert-danger d-flex align-items-center"
          role="alert"
          style="display: none; margin-top: 15px"
        >
          <span class="error-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="12" fill="#e74c3c" />
              <path
                d="M7 13.5L10.5 17L17 10.5"
                stroke="#fff"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <div style="margin-left: 10px">Please fill in all fields!</div>
        </div>

        <label for="email">Email or Phone Number</label>
        <input
          type="text"
          id="email"
          placeholder="Enter your email or phone number"
          class="input-field"
        />
        <h6 class="error-message" id="error-email">
          Email or phone is required
        </h6>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          class="input-field"
        />
        <h6 class="error-message" id="error-password">Password is required</h6>

        <a href="#" class="forgot-password" id="forgotPasswordLink"
          >Forgot Password?</a
        >

        <button type="submit" class="login-btn">Login</button>
        <p class="signup-link">
          <a href="./registration-clean.html"
            >Don't have an account? Register here</a
          >
        </p>
      </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Reset Password</h3>
        <p>
          Enter your email address and we'll send you a link to reset your
          password.
        </p>
        <form id="resetForm">
          <label for="resetEmail">Email</label>
          <input
            type="email"
            id="resetEmail"
            placeholder="Enter your email"
            required
          />
          <button type="submit" class="reset-btn">Send Reset Link</button>
        </form>
        <div
          id="resetAlert"
          class="alert alert-danger d-flex align-items-center"
          role="alert"
          style="display: none; margin-top: 15px"
        >
          <div></div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js"></script>
    <script src="./firebase-auth-simple.js"></script>

    <script>
      // Inline login function to avoid recursion issues
      function performLogin(email, password) {
        return new Promise((resolve) => {
          console.log('Inline login started for:', email);
          
          setTimeout(() => {
            try {
              // Check if user exists in localStorage
              const existingUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
              const userExists = existingUsers.find(user => 
                user.email.toLowerCase() === email.toLowerCase()
              );
              
              if (!userExists) {
                resolve({ 
                  success: false, 
                  message: 'User not found! Please register first.' 
                });
                return;
              }
              
              // Create user object
              const user = {
                uid: userExists.uid,
                email: email,
                displayName: email.split('@')[0]
              };
              
              // Save session
              localStorage.setItem('userSession', JSON.stringify({
                user: {
                  uid: user.uid,
                  email: user.email,
                  displayName: user.displayName
                },
                deviceId: 'device_' + Date.now()
              }));
              
              console.log('Inline login successful:', user);
              
              resolve({ 
                success: true, 
                message: 'Login successful!',
                user: user
              });
              
            } catch (error) {
              console.error('Inline login error:', error);
              resolve({ 
                success: false, 
                message: 'Login failed. Please try again.' 
              });
            }
          }, 100);
        });
      }

      // Helper to show alerts
      function showAlert(message, duration = 3000, type = "error") {
        const alertDiv = document.getElementById("loginAlert");
        if (!alertDiv) return;

        alertDiv.querySelector("div").textContent = message;

        // Remove previous alert classes
        alertDiv.classList.remove("alert-danger", "alert-success");

        // Add class based on type and set background color
        if (type === "success") {
          alertDiv.classList.add("alert-success");
          alertDiv.style.backgroundColor = "#27ae60";
          alertDiv.style.color = "#ffffff";
        } else {
          alertDiv.classList.add("alert-danger");
          alertDiv.style.backgroundColor = "#e74c3c";
          alertDiv.style.color = "#ffffff";
        }

        alertDiv.style.display = "flex";

        if (duration > 0) {
          setTimeout(() => {
            alertDiv.style.display = "none";
          }, duration);
        }
      }

      // Handle form submission
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
          let valid = true;

          // Required field validation
          if (!email) {
            showAlert("Email or phone is required!");
            valid = false;
          }
          if (!password) {
            showAlert("Password is required!");
            valid = false;
          }

          if (!valid) {
            return;
          }

          // Show loading state
          const submitBtn = document.querySelector(".login-btn");
          const originalText = submitBtn.textContent;
          submitBtn.textContent = "Logging in...";
          submitBtn.disabled = true;

          try {
            // Use inline login function
            console.log("Using inline login function...");
            const loginResult = await performLogin(email, password);
            console.log("Inline login result:", loginResult);

            if (loginResult && loginResult.success) {
              showAlert("Login successful!", 1000, "success");
              setTimeout(() => {
                window.location.href = "Dashboard.html";
              }, 1000);
            } else {
              // Show specific error messages
              if (loginResult && loginResult.message) {
                showAlert(loginResult.message);
              } else {
                showAlert("Login failed! Please try again.");
              }
            }
          } catch (error) {
            console.error("Login error:", error);
            showAlert("Login failed. Please try again.", 3000, "error");
          } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
          }
        });

      // Forgot password functionality
      document
        .getElementById("forgotPasswordLink")
        .addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("forgotPasswordModal").style.display =
            "block";
        });

      document.querySelector(".close").addEventListener("click", function () {
        document.getElementById("forgotPasswordModal").style.display = "none";
      });

      document
        .getElementById("resetForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("resetEmail").value.trim();

          if (!email) {
            document.getElementById("resetAlert").style.display = "flex";
            document
              .getElementById("resetAlert")
              .querySelector("div").textContent =
              "Please enter your email address";
            return;
          }

          // Simulate password reset
          document.getElementById("resetAlert").style.display = "flex";
          document
            .getElementById("resetAlert")
            .querySelector("div").textContent =
            "Password reset link sent to your email!";

          setTimeout(() => {
            document.getElementById("forgotPasswordModal").style.display =
              "none";
            document.getElementById("resetAlert").style.display = "none";
          }, 3000);
        });

      // Close modal when clicking outside
      window.addEventListener("click", function (e) {
        if (e.target === document.getElementById("forgotPasswordModal")) {
          document.getElementById("forgotPasswordModal").style.display = "none";
        }
      });
    </script>
  </body>
</html>
