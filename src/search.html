<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FoodFindr - Professional Recipe Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome for premium icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #ff6b35;
        --primary-dark: #e65c2f;
        --secondary: #4a90e2;
        --accent: #f39c12;
        --success: #28a745;
        --warning: #ffc107;
        --danger: #dc3545;
        --light: #f8f9fa;
        --dark: #343a40;
        --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --card: #ffffff;
        --text: #2c3e50;
        --muted: #6c757d;
        --border: #dee2e6;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text);
        line-height: 1.6;
      }

      .app-container {
        background: var(--card);
        width: 100%;
        max-width: 1200px;
        border-radius: 24px;
        box-shadow: var(--shadow);
        animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
        animation: float 20s infinite linear;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        100% {
          transform: translate(-50px, -50px) rotate(360deg);
        }
      }

      .logo {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 1;
      }

      .tagline {
        font-size: 1.1rem;
        opacity: 0.9;
        font-weight: 300;
        letter-spacing: 0.5px;
      }

      .search-section {
        padding: 40px;
        background: var(--light);
        border-bottom: 1px solid var(--border);
      }

      .search-container {
        position: relative;
        max-width: 600px;
        margin: 0 auto;
      }

      .search-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: white;
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      .search-input-wrapper:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
      }

      .search-icon {
        position: absolute;
        left: 20px;
        color: var(--muted);
        font-size: 1.2rem;
        z-index: 1;
      }

      #foodInput {
        width: 100%;
        padding: 18px 20px 18px 60px;
        border: none;
        background: transparent;
        font-size: 1.1rem;
        outline: none;
      }

      .search-btn {
        position: absolute;
        right: 8px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .search-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
      }

      .content-section {
        padding: 40px;
        min-height: 400px;
      }

      .loader {
        display: none;
        text-align: center;
        padding: 40px;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--border);
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .message {
        text-align: center;
        padding: 20px;
        background: var(--light);
        border-radius: 12px;
        border-left: 4px solid var(--warning);
        margin: 20px 0;
        font-weight: 500;
        display: none;
      }

      .recipe-result {
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .recipe-header {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 30px;
        margin-bottom: 30px;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: var(--shadow-sm);
      }

      .recipe-image-container {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
      }

      .recipe-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .recipe-image:hover {
        transform: scale(1.05);
      }

      .recipe-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--success);
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
      }

      .recipe-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 20px;
        line-height: 1.3;
      }

      .recipe-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }

      .meta-item {
        background: var(--light);
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        border: 1px solid var(--border);
        transition: all 0.3s ease;
      }

      .meta-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
      }

      .meta-icon {
        font-size: 1.5rem;
        margin-bottom: 8px;
        color: var(--primary);
      }

      .meta-label {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 4px;
        font-weight: 500;
      }

      .meta-value {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
      }

      .content-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .instructions-section,
      .ingredients-section {
        background: white;
        border-radius: 20px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .section-header {
        background: linear-gradient(135deg, var(--secondary) 0%, #357abd 100%);
        color: white;
        padding: 20px;
        font-size: 1.3rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .section-content {
        padding: 30px;
      }

      .instructions-list {
        counter-reset: step-counter;
      }

      .instruction-step {
        position: relative;
        padding: 20px 20px 20px 50px;
        margin-bottom: 15px;
        background: var(--light);
        border-radius: 12px;
        border-left: 4px solid var(--secondary);
        transition: all 0.3s ease;
      }

      .instruction-step::before {
        counter-increment: step-counter;
        content: counter(step-counter);
        position: absolute;
        left: 15px;
        top: 20px;
        background: var(--secondary);
        color: white;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .instruction-step:hover {
        transform: translateX(5px);
        box-shadow: var(--shadow-sm);
      }

      .ingredients-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
      }

      .ingredient-item {
        display: flex;
        align-items: center;
        padding: 15px;
        background: var(--light);
        border-radius: 10px;
        border: 1px solid var(--border);
        transition: all 0.3s ease;
      }

      .ingredient-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
        border-color: var(--primary);
      }

      .ingredient-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--accent) 0%, #e67e22 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        margin-right: 15px;
        flex-shrink: 0;
      }

      .ingredient-details {
        flex: 1;
      }

      .ingredient-name {
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }

      .ingredient-amount {
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* ===== Responsive layout (professional) ===== */

      /* Extra Large Screens (1400px and above) */
      @media (min-width: 1400px) {
        .app-container {
          max-width: 1400px;
          margin: 0 auto;
        }

        .header {
          padding: 40px 48px;
        }

        .recipe-header {
          grid-template-columns: 400px 1fr;
          gap: 40px;
        }

        .recipe-image {
          height: 320px;
        }

        .recipe-meta {
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .ingredients-list {
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }
      }

      /* Large Screens (1200px to 1399px) */
      @media (min-width: 1200px) and (max-width: 1399px) {
        .app-container {
          max-width: 1200px;
          margin: 0 auto;
        }

        .header {
          padding: 35px 40px;
        }

        .recipe-header {
          grid-template-columns: 350px 1fr;
          gap: 30px;
        }

        .recipe-image {
          height: 280px;
        }

        .content-grid {
          grid-template-columns: 1fr 1fr;
          gap: 25px;
        }
      }

      /* Desktop / Small Laptops (992px to 1199px) */
      @media (min-width: 992px) and (max-width: 1199px) {
        .app-container {
          max-width: 100%;
          margin: 0 20px;
        }

        .search-container {
          max-width: 820px;
          margin: 0 auto;
        }

        .recipe-header {
          grid-template-columns: 300px 1fr;
          gap: 25px;
        }

        .recipe-image {
          height: 250px;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .recipe-meta {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Tablets (768px to 991px) */
      @media (min-width: 768px) and (max-width: 991px) {
        body {
          padding: 16px;
        }

        .app-container {
          border-radius: 16px;
        }

        .header {
          padding: 20px 18px;
        }

        .logo {
          font-size: 1.9rem;
        }

        .tagline {
          font-size: 1rem;
        }

        .search-section {
          padding: 20px 16px;
        }

        .search-container {
          max-width: 100%;
          padding: 0 6px;
        }

        .search-input-wrapper {
          flex-wrap: nowrap;
        }

        .search-btn {
          position: relative;
          right: 0;
          margin-left: 8px;
          padding: 10px 14px;
        }

        #foodInput {
          padding: 14px 16px 14px 50px;
          font-size: 1rem;
        }

        .recipe-header {
          grid-template-columns: 1fr;
          gap: 20px;
          padding: 20px;
        }

        .recipe-image {
          height: 260px;
        }

        .recipe-title {
          font-size: 1.4rem;
        }

        .recipe-meta {
          grid-template-columns: repeat(2, 1fr);
        }

        .ingredients-list {
          grid-template-columns: repeat(2, 1fr);
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
      }

      /* Large Phones (576px to 767px) */
      @media (min-width: 576px) and (max-width: 767px) {
        body {
          padding: 12px;
        }

        .app-container {
          border-radius: 14px;
        }

        .header {
          padding: 18px 16px;
        }

        .logo {
          font-size: 1.7rem;
        }

        .tagline {
          font-size: 0.9rem;
        }

        .search-section {
          padding: 18px 16px;
        }

        .search-input-wrapper {
          flex-direction: column;
          gap: 10px;
        }

        .search-btn {
          position: relative;
          right: 0;
          margin-left: 0;
          width: 100%;
          justify-content: center;
        }

        #foodInput {
          padding: 14px 16px 14px 45px;
          font-size: 1rem;
        }

        .search-icon {
          left: 15px;
        }

        .recipe-header {
          grid-template-columns: 1fr;
          gap: 15px;
          padding: 18px;
        }

        .recipe-image {
          height: 240px;
        }

        .recipe-title {
          font-size: 1.3rem;
        }

        .recipe-meta {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }

        .ingredients-list {
          grid-template-columns: 1fr;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 18px;
        }
      }

      /* Medium Phones (480px to 575px) */
      @media (min-width: 480px) and (max-width: 575px) {
        body {
          padding: 10px;
        }

        .app-container {
          border-radius: 12px;
        }

        .header {
          padding: 16px 12px;
        }

        .logo {
          font-size: 1.5rem;
        }

        .tagline {
          font-size: 0.9rem;
        }

        .search-section {
          padding: 16px 12px;
        }

        .search-input-wrapper {
          flex-direction: column;
          gap: 8px;
        }

        .search-btn {
          position: relative;
          right: 0;
          margin-left: 0;
          width: 100%;
          justify-content: center;
          padding: 12px;
        }

        #foodInput {
          padding: 12px 12px 12px 42px;
          font-size: 0.95rem;
        }

        .search-icon {
          left: 12px;
        }

        .recipe-header {
          grid-template-columns: 1fr;
          gap: 15px;
          padding: 15px;
        }

        .recipe-image {
          height: 220px;
        }

        .recipe-title {
          font-size: 1.2rem;
        }

        .recipe-meta {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .ingredients-list {
          grid-template-columns: 1fr;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .section-content {
          padding: 20px;
        }

        .instruction-step {
          padding: 14px 14px 14px 40px;
        }

        .ingredient-item {
          padding: 12px;
        }
      }

      /* Small Phones (320px to 479px) */
      @media (min-width: 320px) and (max-width: 479px) {
        body {
          padding: 8px;
        }

        .app-container {
          border-radius: 10px;
        }

        .header {
          padding: 14px 10px;
        }

        .logo {
          font-size: 1.4rem;
        }

        .tagline {
          font-size: 0.85rem;
        }

        .search-section {
          padding: 14px 10px;
        }

        .search-input-wrapper {
          flex-direction: column;
          gap: 8px;
        }

        .search-btn {
          position: relative;
          right: 0;
          margin-left: 0;
          width: 100%;
          justify-content: center;
          padding: 12px;
          font-size: 0.9rem;
        }

        .search-btn i {
          display: none;
        }

        #foodInput {
          padding: 12px 12px 12px 40px;
          font-size: 0.9rem;
        }

        .search-icon {
          left: 12px;
          font-size: 0.9rem;
        }

        .recipe-header {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 12px;
        }

        .recipe-image {
          height: 200px;
        }

        .recipe-title {
          font-size: 1.15rem;
        }

        .recipe-meta {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .meta-item {
          padding: 8px;
        }

        .ingredients-list {
          grid-template-columns: 1fr;
        }

        .content-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .section-content {
          padding: 16px;
        }

        .instruction-step {
          padding: 12px 12px 12px 35px;
          font-size: 0.9rem;
        }

        .instruction-step::before {
          width: 20px;
          height: 20px;
          font-size: 0.8rem;
          left: 8px;
        }

        .ingredient-item {
          padding: 10px;
          gap: 8px;
        }

        .ingredient-icon {
          width: 32px;
          height: 32px;
          font-size: 0.9rem;
        }

        .ingredient-name {
          font-size: 0.9rem;
        }

        .ingredient-amount {
          font-size: 0.8rem;
        }
      }

      /* Ultra Small Phones (0px to 319px) */
      @media (max-width: 319px) {
        body {
          padding: 6px;
        }

        .app-container {
          border-radius: 8px;
        }

        .header {
          padding: 12px 8px;
        }

        .logo {
          font-size: 1.2rem;
        }

        .tagline {
          font-size: 0.8rem;
        }

        .search-section {
          padding: 12px 8px;
        }

        #foodInput {
          padding: 10px 10px 10px 35px;
          font-size: 0.85rem;
        }

        .search-icon {
          left: 10px;
          font-size: 0.8rem;
        }

        .recipe-header {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 10px;
        }

        .recipe-image {
          height: 180px;
        }

        .recipe-title {
          font-size: 1rem;
        }

        .meta-item {
          padding: 6px;
          font-size: 0.8rem;
        }

        .section-content {
          padding: 12px;
        }

        .instruction-step {
          padding: 10px 10px 10px 30px;
          font-size: 0.85rem;
        }

        .ingredient-item {
          padding: 8px;
        }

        .ingredient-icon {
          width: 28px;
          height: 28px;
          font-size: 0.8rem;
        }
      }

      /* Print styles */
      @media print {
        body {
          background: white;
        }
        .app-container {
          box-shadow: none;
          border-radius: 0;
          max-width: 100%;
        }
        .search-section,
        .header::before {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <!-- Professional Header -->
      <div class="header">
        <div class="logo"><i class="fas fa-utensils"></i> FoodFindr</div>
        <div class="tagline">Discover Amazing Recipes Instantly</div>
      </div>

      <!-- Search Section -->
      <div class="search-section">
        <div class="search-container">
          <div class="search-input-wrapper" id="searchWrapper">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              id="foodInput"
              placeholder="Search for any recipe... (e.g., pasta, chicken, salad)"
              autocomplete="off"
            />
            <button class="search-btn" onclick="searchFood()">
              <i class="fas fa-search"></i>
              Search
            </button>
          </div>
        </div>
      </div>

      <!-- Content Section -->
      <div class="content-section">
        <!-- Loader -->
        <div id="loader" class="loader">
          <div class="spinner"></div>
          <p style="margin-top: 15px; color: var(--muted)">
            Finding perfect recipe...
          </p>
        </div>

        <!-- Message -->
        <div id="message" class="message"></div>

        <!-- Recipe Results Container -->
        <div id="recipeContainer"></div>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
